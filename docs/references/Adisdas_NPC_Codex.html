<script>
(function(){'use strict';
const STORE='adisdas-npc-codex-v1';
const seed=JSON.parse(document.getElementById('seed-data').textContent);
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const br=v=>esc(v||'טרם הוכן');
const nval=v=>(v===null||v===undefined||v==='')?null:(Number.isFinite(Number(v))?Number(v):null);
const stamp=()=>new Date().toLocaleString('he-IL');
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const copy=o=>JSON.parse(JSON.stringify(o));
let state=copy(seed), storageOk=true;
try{const raw=localStorage.getItem(STORE);if(raw){const restored=JSON.parse(raw);if(validState(restored))state=restored;}}catch(e){storageOk=false;}

// Data revision 3: import newly received level-6 sheets without discarding personal edits.
function applyDataRevision(){
 const rev=state.dataRevision||0;
 if(rev<2){
  for(const id of ['frosta','doin']){const cur=state.npcs.find(n=>n.id===id),fresh=seed.npcs.find(n=>n.id===id);if(cur&&fresh){cur.stats=copy(fresh.stats);cur.statsNote=fresh.statsNote;cur.status=fresh.status;}}
  for(const id of ['yiko','krysov','junior']){const cur=state.npcs.find(n=>n.id===id),fresh=seed.npcs.find(n=>n.id===id);if(cur&&fresh){cur.notes=fresh.notes;}}
 }
 if(rev<3){
  for(const newer of seed.players){const p=state.players.find(x=>x.id===newer.id);if(!p){state.players.push(copy(newer));continue;}
   for(const k of ['hpMax','ac','initiativeBonus','currentHp']){if(p[k]===null||p[k]===undefined||p[k]==='')p[k]=newer[k];}
   const oldClass=p.className||'';
   if(/Moon Druid|Hunter Ranger|Evocation\)|Champion\)|Wizard 5|Fighter 5|Druid 5|Ranger 5/i.test(oldClass)||!oldClass)p.className=newer.className;
   if(!p.name||p.id==='pc-johny'&&p.name==='Johny Woods')p.name=newer.name;
   if(!p.notes||/דף רמה 5 ישן|ממתינים לדף מעודכן|אין לקבוע HP/.test(p.notes))p.notes=newer.notes;
   for(const k of ['speed','pb','abilities','features','attacks','resources','spells','equipment','source']){
    if(p[k]===null||p[k]===undefined||p[k]==='')p[k]=copy(newer[k]);
   }
  }
  // Existing encounter state stays intact: only fill previous blank maxima/AC,
  // while leaving actual current HP and rolled initiative untouched.
  for(const enc of state.encounters){for(const fighter of enc.participants||[]){if(fighter.entityType!=='player')continue;const p=state.players.find(x=>x.id===fighter.entityId);if(!p)continue;if(fighter.hpMax==null)fighter.hpMax=p.hpMax;if(fighter.ac==null)fighter.ac=p.ac;}}
 }
 if(rev<4){
  // Legacy encounters owned their own HP. Adopt HP from the active encounter
  // only when the player's canonical HP was not entered yet.
  const active=state.encounters.find(x=>x.id===state.currentEncounterId);
  for(const player of state.players){
   const fighter=active?.participants?.find(f=>f.entityType==='player'&&f.entityId===player.id);
   if(fighter){
    if(player.currentHp==null&&fighter.hpCurrent!=null)player.currentHp=fighter.hpCurrent;
    if(player.hpMax==null&&fighter.hpMax!=null)player.hpMax=fighter.hpMax;
   }
  }
 }
 // Always reconcile existing encounters from the shared player record.
 for(const player of state.players){
  const hpMax=nval(player.hpMax), current=nval(player.currentHp);
  player.hpMax=hpMax;
  player.currentHp=current===null?null:Math.max(0,Math.min(current,hpMax??Infinity));
  for(const enc of state.encounters){for(const fighter of enc.participants||[]){
   if(fighter.entityType==='player'&&fighter.entityId===player.id){
    fighter.hpMax=player.hpMax;fighter.hpCurrent=player.currentHp;
   }
  }}
 }
 state.dataRevision=4;
}
applyDataRevision();
try{localStorage.setItem(STORE,JSON.stringify(state));}catch(e){storageOk=false;}
let ui={view:'codex',locationId:'manor',npcId:'krysov',query:'',modal:null};
function validState(s){return s&&s.schemaVersion===1&&Array.isArray(s.locations)&&Array.isArray(s.npcs)&&Array.isArray(s.players)&&Array.isArray(s.encounters)&&Array.isArray(s.savedEncounters)&&s.locations.length<2000&&s.npcs.length<10000&&s.players.length<1000;}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state));storageOk=true;}catch(e){storageOk=false;}}
function toast(message){const el=$('#toast');el.textContent=message;el.classList.remove('hide');clearTimeout(window.__npcToast);window.__npcToast=setTimeout(()=>el.classList.add('hide'),3300);}
function npcById(id){return state.npcs.find(x=>x.id===id)}
function locationById(id){return state.locations.find(x=>x.id===id)}
function playerById(id){return state.players.find(x=>x.id===id)}
// Character sheet is the single source of truth for PLAYER HP.
// All current/past encounter rows mirror it; NPC/squad HP remains independent.
function setPlayerHp(id,patch){
 const player=playerById(id);if(!player)return;
 const has=(key)=>Object.prototype.hasOwnProperty.call(patch,key);
 let max=nval(has('hpMax')?patch.hpMax:player.hpMax);
 let current=nval(has('currentHp')?patch.currentHp:player.currentHp);
 if(max!==null)max=Math.max(1,Math.trunc(max));
 if(current!==null)current=Math.max(0,Math.trunc(current));
 if(current!==null&&max!==null)current=Math.min(current,max);
 player.hpMax=max;player.currentHp=current;
 for(const enc of state.encounters){for(const fighter of enc.participants||[]){
  if(fighter.entityType==='player'&&fighter.entityId===id){
   fighter.hpMax=max;fighter.hpCurrent=current;
  }

function renderCombat(){const e=ensureEncounter();const ps=turnEntries(e);const cur=ps.find(p=>p.uid===e.turnUid);const currentName=cur?.participant?.label||cur?.squad?.name||'עוד לא התחיל';const playerCount=e.participants.filter(p=>p.entityType==='player').length;
 $('#app').innerHTML=`<main class="full"><div class="pagehead"><div><div class="eyebrow">ENCOUNTER MANAGER</div><h1>⚔ מעקב קרב</h1><div class="muted">Initiative, חיים, מצבים וחוליות חיילים — בלי מגלגל קוביות.</div></div><div class="toolbar"><button class="button gold" data-action="add-fighter-pick">＋ הוסף משתתף</button><button class="button" data-action="add-squad">♟ הוסף חוליית חיילים</button><button class="button" data-action="snapshot">▣ שמור קרב</button><button class="button ghost" data-action="new-encounter">↻ קרב חדש</button></div></div><div class="kpi-strip"><div class="kpi"><div class="kpi-label">סיבוב</div><div class="kpi-value">${e.round}</div></div><div class="kpi"><div class="kpi-label">תור נוכחי</div><div class="kpi-value" style="font-size:15px;padding-top:5px">${esc(currentName)}</div></div><div class="kpi"><div class="kpi-label">משתתפים · שחקנים</div><div class="kpi-value">${e.participants.length} <span style="font-size:12px;color:var(--muted)">· ${playerCount} שחקנים, ${e.squads.length} חוליות</span></div></div></div><div class="combat-grid"><section><div class="panelhead"><h2>סדר Initiative</h2><button class="button gold" data-action="next-turn">${e.turnUid?'→ התור הבא':'▶ התחל קרב'}</button></div><div class="fighters">${ps.map(p=>renderTurn(p,e)).join('')||'<div class="empty">הקרב ריק. הוסף משתתפים.</div>'}</div></section><aside class="sidebar-note"><div class="eyebrow">CURRENT ENCOUNTER</div><div class="sectiontitle">פרטי קרב</div><div class="field"><span class="meta">שם הקרב</span><input data-enc-field="name" value="${esc(e.name)}" /></div><div class="field" style="margin-top:10px"><span class="meta">מיקום</span><select data-enc-field="locationId">${state.locations.map(l=>`<option value="${esc(l.id)}" ${e.locationId===l.id?'selected':''}>${esc(l.name)}</option>`).join('')}</select></div><div class="rule"></div><div class="sectiontitle">הערות</div><p class="smallnote">הזנת Initiative ידנית ממיינת את המשתתפים. שינוי HP של שחקן כאן מעדכן מיד גם את דף הדמות (וגם להפך). חיילים ו־NPCs שומרים חיים נפרדים, בלי לשנות את תבנית ה־NPC. לחוליה יש Initiative אחד ומטרה שניתן לשנות. כל חייל שומר HP ומצבים אישיים. החוליה אינה זורקת התקפה או נזק אוטומטית.</p><div class="rule"></div><div class="sectiontitle">קרבות שמורים</div>${state.savedEncounters.length?`<div class="savedlist">${state.savedEncounters.slice().reverse().map(s=>`<div class="side-row" style="align-items:center"><button class="savedbtn" data-action="load-snapshot" data-id="${esc(s.id)}">${esc(s.name)}<br/><span class="dim" style="font-size:10px">${esc(s.savedAt)}</span></button><button class="button tiny ghost" data-action="delete-snapshot" data-id="${esc(s.id)}" title="מחק צילום מצב">✕</button></div>`).join('')}</div>`:'<div class="smallnote">עדיין לא שמרת קרב.</div>'}<div class="rule"></div><div class="smallnote">השמירה האוטומטית נעשית בדפדפן. מומלץ לייצא גיבוי JSON אחרי כל סשן.</div></aside></div></main>`;
}
function formField(name,label,value='',type='text',wide=false,placeholder=''){const v=String(value??'');return `<label class="field ${wide?'wide':''}"><span>${esc(label)}</span>${type==='textarea'?`<textarea name="${name}" placeholder="${esc(placeholder)}">${esc(v)}</textarea>`:type==='select'?placeholder:`<input type="${type}" name="${name}" value="${esc(v)}" placeholder="${esc(placeholder)}" />`}</label>`;}
function modal(title,body,footer=''){ui.modal=true;$('#modalRoot').innerHTML=`<div class="modal-overlay" data-action="backdrop"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modalheader"><h2>${esc(title)}</h2><button class="button tiny ghost" data-action="close-modal" aria-label="סגור">✕</button></div>${body}${footer}</div></div>`;}
function closeModal(){ui.modal=null;$('#modalRoot').innerHTML=''}
function editNpc(id){let n=id?npcById(id):newNpc(uid(),ui.locationId,'','');if(!n)return;const s=n.stats||{};
 const choices=state.locations.map(l=>`<option value="${esc(l.id)}" ${n.locationId===l.id?'selected':''}>${esc(l.name)}</option>`).join('');
 const kindOptions=`<option value="npc" ${n.kind!=='template'?'selected':''}>דמות אישית</option><option value="template" ${n.kind==='template'?'selected':''}>קבוצת NPCs / Stat Block משותף</option>`;
 const body=`<form id="npcForm" data-id="${esc(id||'')}" class="modalbody"><div class="formgrid">
 ${formField('name','שם',n.name)}${formField('role','תפקיד',n.role)}
 ${formField('locationId','מיקום',n.locationId,'select',false,`<select name="locationId">${choices}</select>`)}${formField('kind','סוג רשומה',n.kind,'select',false,`<select name="kind">${kindOptions}</select>`)}
 ${formField('status','מצב נוכחי',n.status,'text',true)}
 <div class="formsep">🎭 משחק תפקידים</div>
 ${formField('appearance','מראה חיצוני',n.appearance,'textarea')}${formField('voice','אופן דיבור',n.voice,'textarea')}
 ${formField('personality','אישיות ומניעים',n.personality,'textarea',true)}
 ${formField('knows','מה יודע',n.knows,'textarea')}${formField('reveals','מה יספר לשחקנים',n.reveals,'textarea')}
 ${formField('secrets','סודות למאסטר',n.secrets,'textarea',true)}${formField('quotes','דיאלוגים מוכנים',n.quotes,'textarea',true)}
 ${formField('notes','הערות מהסשן',n.notes,'textarea',true)}
 <div class="formsep">⚔ נתוני קרב — אפשר להשאיר ריק</div>
 ${formField('hpMax','HP מרבי',s.hpMax,'number')}${formField('ac','AC',s.ac,'number')}
 ${formField('speed','Speed',s.speed)}${formField('cr','CR',s.cr)}
 ${['str','dex','con','int','wis','cha'].map(x=>formField(x,x.toUpperCase(),s[x])).join('')}
 ${formField('saves','Saving Throws',s.saves,'textarea')}${formField('skills','Skills',s.skills,'textarea')}
 ${formField('attacks','התקפות',s.attacks,'textarea',true)}${formField('features','יכולות',s.features,'textarea',true)}
 ${formField('alignment','Alignment',s.alignment)}${formField('statsNote','הערת סטטים / מקור',n.statsNote,'textarea')}
 ${formField('source','קבצי מקור / מקור המידע',n.source,'text',true)}
 </div></form>`;
 const foot=`<div class="modalfooter"><button class="button ghost" data-action="close-modal">ביטול</button><button form="npcForm" type="submit" class="button gold">✓ שמירת NPC</button></div>`;modal(id?'עריכת NPC':'הוספת NPC',body,foot);
}
function editLocation(id){const loc=locationById(id)||{id:'',name:'',group:'בורדלין',icon:'◇',desc:'',state:'בהכנה',locked:false};const body=`<form class="modalbody" id="locationForm" data-id="${esc(id||'')}"><div class="formgrid">${formField('name','שם המיקום',loc.name)}${formField('group','אזור',loc.group)}${formField('icon','סמל קצר',loc.icon)}${formField('state','סטטוס',loc.state)}${formField('desc','תיאור',loc.desc,'textarea',true)}</div></form>`;modal(id?'עריכת מיקום':'מיקום חדש',body,`<div class="modalfooter"><button class="button ghost" data-action="close-modal">ביטול</button><button class="button gold" form="locationForm" type="submit">שמירה</button></div>`);}
function editPlayer(id){const p=playerById(id);if(!p)return;const body=`<form class="modalbody" id="playerForm" data-id="${esc(id)}"><div class="formgrid">${formField('name','שם הדמות',p.name)}${formField('player','שם השחקן',p.player)}${formField('className','גזע, מחלקה ורמה',p.className,'text',true)}${formField('currentHp','HP נוכחי',p.currentHp,'number')}${formField('hpMax','HP מרבי',p.hpMax,'number')}${formField('ac','AC',p.ac,'number')}${formField('initiativeBonus','בונוס Initiative (לא התוצאה בקרב)',p.initiativeBonus,'number')}${formField('speed','מהירות',p.speed)}${formField('attacks','התקפות',p.attacks,'textarea',true)}${formField('features','יכולות מיוחדות',p.features,'textarea',true)}${formField('spells','לחשים ו-Prepared',p.spells,'textarea',true)}${formField('resources','משאבים ו-Spell Slots',p.resources,'textarea',true)}${formField('equipment','ציוד',p.equipment,'textarea',true)}${formField('notes','הערות והשלמות',p.notes,'textarea',true)}</div></form>`;modal('עריכת דמות שחקן',body,`<div class="modalfooter"><button class="button ghost" data-action="close-modal">ביטול</button><button class="button gold" form="playerForm" type="submit">שמירה</button></div>`);}
function addSquadPicker(){const opt=state.npcs.filter(x=>x.kind==='template').map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('');const body=`<form id="squadForm" class="modalbody"><div class="formgrid">${formField('name','שם חוליה',`חוליה ${(ensureEncounter().squads||[]).length+1}`)}${formField('template','תבנית חיילים',null,'select',false,`<select name="template">${opt}</select>`)}${formField('quantity','מספר חיילים בחוליה',5,'number')}${formField('initiative','Initiative משותף',null,'number')}${formField('targetId','מטרה עיקרית',null,'select',true,`<select name="targetId"><option value="">לא נקבעה</option>${state.players.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}</select>`)}<div class="smallnote">מומלץ 4–5 חיילים לחוליה. תור אחד לכל החוליה, אבל חיים ומצבים נפרדים לכל חייל. ניתן לשנות את המטרה והתור בכל עת.</div></div></form>`;modal('חוליית חיילים חדשה',body,`<div class="modalfooter"><button class="button ghost" data-action="close-modal">ביטול</button><button class="button gold" form="squadForm" type="submit">יצירת חוליה</button></div>`);}
function createSquad(name,templateId,qty,initiative,targetId){const e=ensureEncounter(),obj=npcById(templateId);if(!obj)return;const sq={id:uid(),name:name||`חוליה ${e.squads.length+1}`,initiative:initiative,targetId:targetId||''};e.squads.push(sq);for(let i=0;i<qty;i++){const p=makeFighter('npc',templateId,e);if(p){p.squadId=sq.id;e.participants.push(p);}}save();closeModal();setView('combat');toast(`נוספה ${sq.name} עם ${qty} חיילים`);}
function addFighterPicker(){const opt=state.players.map(x=>`<option value="player:${esc(x.id)}">שחקן — ${esc(x.name)}</option>`).join('')+state.npcs.map(x=>`<option value="npc:${esc(x.id)}">${esc(locationById(x.locationId)?.name||'')} — ${esc(x.name)}</option>`).join('');const body=`<form id="fighterForm" class="modalbody"><div class="formgrid">${formField('entity','בחר דמות או תבנית',null,'select',true,`<select name="entity">${opt}</select>`)}${formField('quantity','כמות (למשל 5 חיילים)',1,'number')}<div class="field"><span>מידע</span><div class="smallnote">לכל משתתף יהיה HP, Initiative ומצבים נפרדים. כולם ייעזרו באותה תבנית סטטים.</div></div></div></form>`;modal('הוסף משתתפים לקרב',body,`<div class="modalfooter"><button class="button ghost" data-action="close-modal">ביטול</button><button class="button gold" form="fighterForm" type="submit">הוסף לקרב</button></div>`);}
function addFighter(type,id,qty=1){const e=ensureEncounter();const obj=type==='player'?playerById(id):npcById(id);if(!obj)return;let added=0;for(let i=0;i<qty;i++){if(type==='player'&&e.participants.some(p=>p.entityType==='player'&&p.entityId===id))break;const p=makeFighter(type,id,e);if(p){e.participants.push(p);added++}}save();closeModal();setView('combat');toast(added?`נוספו ${added} משתתפים לקרב`:'השחקן כבר מופיע בקרב');}
function snapshot(){const e=ensureEncounter();const item={id:uid(),name:e.name,savedAt:stamp(),data:copy(e)};state.savedEncounters.push(item);save();renderCombat();toast('צילום מצב נשמר לשחזור');}
function exportJson(){const blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2)],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='Adisdas_NPC_Codex_backup_'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('קובץ גיבוי JSON נשמר');}
function renderError(e){console.error(e);toast('אירעה שגיאה. נסה שוב או שחזר גיבוי.');}
// Event delegation so re-rendering doesn't discard handlers
$('#app').addEventListener('click',ev=>{const b=ev.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;const id=b.dataset.id;const xid=b.dataset.uid;const e=state.encounters.find(x=>x.id===state.currentEncounterId);try{
 switch(a){
 case'open-location':ui.locationId=id;ui.npcId=null;ui.query='';$('#globalSearch').value='';renderCodex();break;
 case'open-npc':{let n=npcById(id);if(n){ui.npcId=id;ui.locationId=n.locationId;renderCodex()}}break;
 case'add-npc':editNpc(null);break;case'edit-npc':editNpc(id);break;
 case'delete-npc':{let n=npcById(id);if(n&&confirm(`למחוק את ${n.name}? המשתתפים שכבר נוספו לקרבות שמורים יישארו שם.`)){state.npcs=state.npcs.filter(x=>x.id!==id);ui.npcId=null;save();renderCodex()}}break;
 case'add-location':editLocation(null);break;case'edit-location':editLocation(id);break;
 case'edit-player':editPlayer(id);break;
 case'add-squad':addSquadPicker();break;case'add-fighter':addFighter('npc',id);break;case'add-player-fighter':addFighter('player',id);break;case'add-fighter-pick':addFighterPicker();break;
 case'jump-to-npc':{let n=npcById(id);if(n){ui.view='codex';ui.locationId=n.locationId;ui.npcId=n.id;render()}}break;
 case'new-encounter':if(confirm('להתחיל קרב חדש? אם תרצה לחזור לקרב הנוכחי, בטל ושמור צילום מצב לפני כן.')){state.currentEncounterId=null;ensureEncounter();renderCombat();toast('קרב חדש נוצר')}break;
 case'next-turn':{const ps=turnEntries(e);if(!ps.length){toast('אין משתתפים בקרב');break}let i=ps.findIndex(p=>p.uid===e.turnUid);if(i<0)e.turnUid=ps[0].uid;else{e.turnUid=ps[(i+1)%ps.length].uid;if(i===ps.length-1)e.round++;}save();renderCombat();break;}
 case'disband-squad':if(e){if(confirm('לפרק את החוליה? החיילים יישארו כיחידים בקרב.')){e.participants.filter(p=>p.squadId===id).forEach(p=>p.squadId=null);e.squads=e.squads.filter(g=>g.id!==id);if(e.turnUid==='squad:'+id)e.turnUid=null;save();renderCombat();}}break;
 case'remove-fighter':if(e){e.participants=e.participants.filter(p=>p.uid!==xid);e.squads=(e.squads||[]).filter(g=>e.participants.some(p=>p.squadId===g.id));if(e.turnUid===xid)e.turnUid=null;save();renderCombat()}break;
 case'adjust-hp':{let p=e?.participants.find(p=>p.uid===xid);if(!p)break;if(p.hpCurrent===null){toast('יש להזין HP נוכחי או מרבי קודם');break}p.hpCurrent=Math.min(p.hpMax??Infinity,Math.max(0,p.hpCurrent+Number(b.dataset.change)));syncFighterHp(p);save();renderCombat();break;}
 case'apply-hp':{let p=e?.participants.find(p=>p.uid===xid);if(!p)break;const amount=nval(document.getElementById('damage-'+xid)?.value);if(amount===null||amount<=0){toast('הכנס מספר חיובי');break}if(p.hpCurrent===null){toast('יש להזין HP נוכחי קודם');break}p.hpCurrent=Math.min(p.hpMax??Infinity,Math.max(0,p.hpCurrent+amount*Number(b.dataset.sign)));syncFighterHp(p);save();renderCombat();break;}
 case'toggle-condition':{let p=e?.participants.find(p=>p.uid===xid);if(!p)break;const c=b.dataset.condition;p.conditions=p.conditions.includes(c)?p.conditions.filter(z=>z!==c):[...p.conditions,c];save();renderCombat();break;}
 case'toggle-dead':{let p=e?.participants.find(p=>p.uid===xid);if(p){p.dead=!p.dead;save();renderCombat()};break;}
 case'snapshot':snapshot();break;
 case'load-snapshot':{const item=state.savedEncounters.find(x=>x.id===id);if(item&&confirm('לשחזר את הקרב השמור? מצב הקרב והחיים של השחקנים יחזרו לצילום המצב השמור.')){const restored=copy(item.data);restored.id=uid();state.encounters.push(restored);state.currentEncounterId=restored.id;for(const fighter of restored.participants||[])syncFighterHp(fighter);save();renderCombat();toast('הקרב וחיי השחקנים שוחזרו')}break;}
 case'delete-snapshot':if(confirm('למחוק צילום מצב זה?')){state.savedEncounters=state.savedEncounters.filter(x=>x.id!==id);save();renderCombat()}break;
 }
 }catch(err){renderError(err)}});
$('#app').addEventListener('change',ev=>{const t=ev.target;
 if(t.dataset.playerField){
  const field=t.dataset.playerField;
  if(!['currentHp','hpMax'].includes(field))return;
  setPlayerHp(t.dataset.id,{[field]:nval(t.value)});
  save();renderPlayers();return;
 }
 const e=state.encounters.find(x=>x.id===state.currentEncounterId);if(!e)return;const field=t.dataset.field;if(t.dataset.squadField){const g=(e.squads||[]).find(x=>x.id===t.dataset.id);if(!g)return;g[t.dataset.squadField]=t.dataset.squadField==='initiative'?nval(t.value):t.value;save();renderCombat();}else if(field){const p=e.participants.find(p=>p.uid===t.dataset.uid);if(!p)return;p[field]=nval(t.value);if(field==='hpMax'&&p.hpCurrent!==null&&p.hpMax!==null)p.hpCurrent=Math.min(p.hpCurrent,p.hpMax);if(p.entityType==='player'&&['hpCurrent','hpMax'].includes(field))syncFighterHp(p);save();renderCombat()}else if(t.dataset.encField){e[t.dataset.encField]=t.value;save();if(t.dataset.encField==='name')renderCombat();}});
$('#modalRoot').addEventListener('click',ev=>{let a=ev.target.closest('[data-action]');if(!a)return;if(a.dataset.action==='close-modal')closeModal();else if(a.dataset.action==='backdrop'&&ev.target===a)closeModal()});
$('#modalRoot').addEventListener('submit',ev=>{ev.preventDefault();const form=ev.target;const fd=new FormData(form);const val=k=>String(fd.get(k)??'').trim();try{
 if(form.id==='npcForm'){const id=form.dataset.id;let n=id?npcById(id):newNpc(uid(),val('locationId'),val('name')||'NPC חדש',val('role'));if(!n)return;if(!val('name')){toast('נדרש שם NPC');return}for(let k of ['name','role','locationId','kind','status','appearance','voice','personality','knows','reveals','secrets','quotes','notes','source','statsNote'])n[k]=val(k);n.stats=n.stats||{};for(let k of ['speed','str','dex','con','int','wis','cha','saves','skills','attacks','features','cr','alignment'])n.stats[k]=val(k);for(let k of ['hpMax','ac'])n.stats[k]=nval(val(k));if(!id)state.npcs.push(n);ui.locationId=n.locationId;ui.npcId=n.id;ui.query='';$('#globalSearch').value='';save();closeModal();setView('codex');toast('דף NPC נשמר');}
 else if(form.id==='locationForm'){const id=form.dataset.id;let l=id?locationById(id):{id:uid(),locked:false};if(!l)return;if(!val('name')){toast('נדרש שם מיקום');return}for(let k of ['name','group','icon','state','desc'])l[k]=val(k);if(!id)state.locations.push(l);ui.locationId=l.id;ui.npcId=null;save();closeModal();setView('codex');toast('מיקום נשמר');}
 else if(form.id==='playerForm'){const p=playerById(form.dataset.id);if(!p)return;for(let k of ['name','player','className','speed','attacks','features','spells','resources','equipment','notes'])p[k]=val(k);for(let k of ['ac','initiativeBonus'])p[k]=nval(val(k));setPlayerHp(p.id,{currentHp:nval(val('currentHp')),hpMax:nval(val('hpMax'))});save();closeModal();renderPlayers();toast('נתוני השחקן והחיים סונכרנו עם הקרב');}
 else if(form.id==='squadForm'){const count=Math.min(15,Math.max(1,Math.trunc(nval(val('quantity'))||5)));createSquad(val('name'),val('template'),count,nval(val('initiative')),val('targetId'));}
 else if(form.id==='fighterForm'){const ent=val('entity').split(':');const count=Math.min(50,Math.max(1,Math.trunc(nval(val('quantity'))||1)));if(ent.length!==2)return;addFighter(ent[0],ent[1],count);}
 }catch(err){renderError(err)}});
document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.nav)));
$('#globalSearch').addEventListener('input',ev=>{ui.query=ev.target.value;renderCodex()});
document.querySelector('[data-action="export"]').addEventListener('click',exportJson);
document.querySelector('[data-action="import"]').addEventListener('click',()=>$('#fileImport').click());
$('#fileImport').addEventListener('change',async ev=>{const f=ev.target.files?.[0];if(!f)return;try{if(f.size>5*1024*1024)throw Error('גדול מדי');const s=JSON.parse(await f.text());if(!validState(s))throw Error('פורמט לא נתמך');if(!confirm('ייבוא הגיבוי יחליף את כל השינויים שבממשק. להמשיך?'))return;state=s;applyDataRevision();save();ui.locationId=state.locations[0]?.id||'manor';ui.npcId=null;ui.query='';$('#globalSearch').value='';setView('codex');toast('הנתונים שוחזרו מהגיבוי.');}catch(err){toast('קובץ הגיבוי אינו תקין או אינו תואם לגרסה.')}finally{ev.target.value='';}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.modal)closeModal()});
render();if(!storageOk){toast('שמירה מקומית לא זמינה בדפדפן זה. השתמש בגיבוי JSON.');}
})();
</script>
</body>
</html>
