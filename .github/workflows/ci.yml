name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web build and unit tests
    runs-on: ubuntu-latest
    env:
      # Placeholder values: the build only needs a well-formed URL and key.
      # No real project is contacted in CI.
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_PUBLISHABLE_KEY: ci-placeholder-not-a-real-key
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  database:
    name: Database migrations and pgTAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start Postgres, Auth, Realtime and Storage; apply migrations
        run: >-
          npx supabase start
          -x imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Run pgTAP tests
        run: npx supabase test db
      - name: Stop
        if: always()
        run: npx supabase stop --no-backup

  realtime:
    # Live checks with real users against a local stack: the REST API surface
    # (T03) and Realtime private channels (T02b). Not a required check (yet);
    # the owner decides whether to make it one.
    name: Live API and Realtime checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start Postgres, Auth, Realtime, Storage, REST and gateway
        run: >-
          npx supabase start
          -x imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Live API and Realtime tests
        run: |
          eval "$(npx supabase status -o env)"
          export API_URL ANON_KEY SERVICE_ROLE_KEY PUBLISHABLE_KEY SECRET_KEY
          node tests/api/campaigns.mjs
          node tests/api/characters.mjs
          node tests/api/pdfs.mjs
          node tests/api/join.mjs
          node tests/realtime/user-channel.mjs
      - name: Stop
        if: always()
        run: npx supabase stop --no-backup
